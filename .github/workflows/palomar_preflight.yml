name: Palomar preflight

# Runs Palomar's complete mechanical verification on this commit, as the registry does after a
# submission, and publishes its report as an artifact. The verifier fetches the repository
# anonymously, so the repository must be public. A run can take hours, so it only runs on demand.
# `uses` and `pipeline_commit` pin the same full PalomarSubmission commit
# (git ls-remote https://github.com/PalomarRegistry/PalomarSubmission.git HEAD); `request_id` is
# exactly 12 lowercase letters or digits. The Palomar files are in Palomar/: the Comparator
# configuration and the metadata are named explicitly.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"Palomar/comparator.json","formalization_metadata_path":"Palomar/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
