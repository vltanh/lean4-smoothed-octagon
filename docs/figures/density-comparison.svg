<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-label="The packing densities area/√12 of the smoothed (6k + 2)-gons for k = 1, …, 6 (the area computed as the cost of the trajectory): they increase with k towards the density π/√12 of the disk (dashed). The smoothed octagon (k = 1, orange) has the least, δ_oct ≈ 0.902414, below the regular octagon’s (4 + 4√2)/(5 + 4√2) ≈ 0.906164">
