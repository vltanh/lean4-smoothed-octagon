sources:
  - title: "A proof of the Reinhardt conjecture"
    type: original-proof
    relationship: other
    note: >-
      ChatGPT Pro (OpenAI) found the proof, in research notes written in pull requests #1 and #2 of
      this repository and archived in docs/archive/, starting from Hales's control formulation and
      Hales and Vajjha's book. Claude Opus 5.5 (Anthropic) wrote the Lean proof from those notes,
      and the manuscript in docs/paper/. No person has reviewed the proof. docs/CREDITS.md tells
      how the work was done.
  - title: "Über die dichteste gitterförmige Lagerung kongruenter Bereiche in der Ebene und eine besondere Art konvexer Kurven"
    authors:
      - "Karl Reinhardt"
    id: "doi:10.1007/BF02940676"
    type: paper
    location: "Abhandlungen aus dem Mathematischen Seminar der Universität Hamburg 10 (1934), 216-230"
    relationship: background
    note: >-
      Poses the problem and proposes, on p. 230, the regular octagon with each corner cut off by the
      hyperbola tangent to its two sides and asymptotic to the next two. The Challenge's
      smoothedOctagon is this description, in coordinates where the octagon has inradius 1.
    author_endorsement: n/a
  - title: "On the area and the densest packing of convex domains"
    authors:
      - "Kurt Mahler"
    type: paper
    location: "Proceedings of the Koninklijke Nederlandse Akademie van Wetenschappen 50 (1947), 108-118"
    relationship: background
    note: >-
      Mahler's independent formulation of the problem in the calculus of variations, with the
      conjecture that the boundary of an extreme domain consists of segments and arcs of
      hyperbolas. Context only.
    author_endorsement: n/a
  - title: "On the Reinhardt conjecture"
    authors:
      - "Thomas C. Hales"
    id: "arXiv:1103.4518"
    type: paper
    location: "Vietnam Journal of Mathematics 39 (2011), no. 3, 287-307"
    relationship: background
    note: "Casts the problem as a problem of Bolza; context for the control formulation."
    author_endorsement: not-contacted
  - title: "The Reinhardt conjecture as an optimal control problem"
    authors:
      - "Thomas C. Hales"
    id: "arXiv:1703.01352"
    type: paper
    location: "https://arxiv.org/abs/1703.01352"
    relationship: background
    note: >-
      The optimal control problem on SL2(R) whose lower bound the proof establishes; the cost of a
      trajectory is the area of the disk it bounds.
    author_endorsement: not-contacted
  - title: "Packings of Smoothed Polygons"
    authors:
      - "Thomas Hales"
      - "Koundinya Vajjha"
    id: "arXiv:2405.04331v1"
    type: book
    location: "https://arxiv.org/abs/2405.04331v1"
    relationship: background
    note: >-
      The definitions of packings and of the greatest packing density (Definition 2.1.1), the
      control problem, its Pontryagin extremals and the compact domain (Definition 5.0.1, Theorem
      5.0.2). These results are proved in lean4-smoothed-polygon; the abstract states that the
      Reinhardt conjecture remains open.
    author_endorsement: not-contacted
  - title: "Some packing and covering theorems"
    authors:
      - "László Fejes Tóth"
    type: paper
    location: "Acta Scientiarum Mathematicarum (Szeged) 12 A (1950), 62-67"
    relationship: background
    note: >-
      No packing of a centrally symmetric convex disk by congruent copies is denser than its
      densest lattice packing, so Reinhardt's lattice problem is the problem for all packings.
      Proved in lean4-smoothed-polygon.
    author_endorsement: n/a

related_formalizations:
  - id: "https://github.com/vltanh/lean4-smoothed-polygon"
    relationship: builds-on
    note: >-
      The formalization of Hales and Vajjha's book by the same maintainer, pinned at commit
      b9846532aa26ddf49945ae9fe94549f3ed7918d2: packings and the greatest packing density, Fejes
      Toth's and Mahler's theorems, the control reformulation, the Pontryagin lift of a global
      minimizer, Theorem 5.0.2 and the density of the smoothed octagon. Its packing definitions are
      copied into the Challenge, and SmoothedOctagon/Bridge/Classical.lean proves that the copies
      agree with the library's. It does not prove the conjecture.
  - id: "https://github.com/vltanh/lean4-optimal-control"
    relationship: builds-on
    note: >-
      Filippov's theorem and the Pontryagin maximum principle, by the same maintainer, used through
      lean4-smoothed-polygon at commit 88689a80ebc400f2e7b3656ee0b9d95a7bf42820.

status:
  scope: >-
    Formalized: the Reinhardt conjecture (every centrally symmetric convex disk has greatest packing
    density at least (8 - 4 sqrt 2 - log 2)/(2 sqrt 2 - 1)); its equality case (equality if and
    only if the disk is the image of the smoothed octagon under an invertible affine map); and that
    the smoothed octagon, as Reinhardt described it, is a centrally symmetric convex disk of that
    greatest packing density. These three statements are the ones Comparator checks. The library
    also proves, outside the Challenge, the control form: every admissible trajectory of Hales's
    problem, with any measurable control, costs at least sqrt 12 times that density, and the
    octagon's trajectory attains it (SmoothedOctagon.reinhardt_cost, SmoothedOctagon.octagon_area).
    The formalization is unconditional; its foundations are proved in the pinned libraries
    lean4-smoothed-polygon and lean4-optimal-control.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

