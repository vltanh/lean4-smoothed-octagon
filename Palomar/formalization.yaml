version: "v0.4"

# The Palomar entry of this repository: the Challenge Palomar/Challenge.lean (module
# Palomar.Challenge), the Solution SmoothedOctagon.lean (module SmoothedOctagon), the Comparator
# configuration Palomar/comparator.json, and this file (submit with
# formalization_metadata_path: Palomar/formalization.yaml). The Challenge is not a top-level module
# Challenge because lean4-smoothed-polygon, a dependency, has one.

project:
  name: "The Reinhardt conjecture, formalized in Lean 4"
  # The description is shown as plain text that keeps line breaks. Its paragraphs are separated by
  # two empty lines, which this folded block turns into one empty line.
  description: >-
    The Reinhardt problem asks for the centrally symmetric convex disk in the plane whose densest
    packing by congruent copies is least dense. Karl Reinhardt (1934) and, independently, Kurt
    Mahler (1947) found the smoothed octagon, a regular octagon whose corners are cut off by arcs of
    hyperbolas, each asymptotic to the next two side lines, with greatest packing density
    delta_oct = (8 - 4 sqrt 2 - log 2)/(2 sqrt 2 - 1) = 0.902414..., and Reinhardt conjectured
    that no centrally symmetric convex disk packs worse. The conjecture has been open since 1934;
    Thomas Hales cast it as a problem of Bolza in the calculus of variations (2011) and then as an
    optimal control problem on SL2(R) (2017), and Hales and Koundinya Vajjha studied that problem
    in Packings of Smoothed Polygons (2024).


    This entry proves the conjecture with its equality case. Every centrally symmetric convex disk
    has greatest packing density at least delta_oct, with equality if and only if the disk is the
    image of the smoothed octagon under an invertible affine map; and the smoothed octagon, in
    Reinhardt's description, is a centrally symmetric convex disk of greatest packing density
    delta_oct.


    The proof follows Hales's control formulation. A worst disk is realized by a global minimizer
    of the control problem, which lifts to a Pontryagin extremal, stays in Hales and Vajjha's
    compact domain, switches finitely often and is normal. Its switch signs fall into five classes,
    each excluded for periods with at least six pieces by scalar estimates; periods with at most
    five pieces cost at least the octagon's area, with equality only for the octagon. Every case is
    proved by hand-style arguments: inequalities, identities, monotonicity and convexity, with
    no interval cover. The geometric and control-theoretic foundations, among them Fejes Toth's
    lattice theorem, Theorem 5.0.2 of Hales and Vajjha and the Pontryagin maximum principle, come
    from the pinned libraries lean4-smoothed-polygon and lean4-optimal-control.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

