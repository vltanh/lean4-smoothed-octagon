name = "SmoothedOctagon"
version = "0.1.0"
keywords = ["math", "reinhardt", "packing"]
defaultTargets = ["Cited", "SmoothedOctagon", "ReinhardtChallenge", "ReinhardtSolution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "9d581dfff2e41de989072ea63abf3daf69311520"

[[require]]
name = "SmoothedPolygons"
git = "https://github.com/vltanh/lean4-smoothed-polygon"
rev = "b9846532aa26ddf49945ae9fe94549f3ed7918d2"

[[lean_lib]]
name = "Cited"
globs = ["Cited.+"]

[[lean_lib]]
name = "SmoothedOctagon"
globs = ["SmoothedOctagon", "SmoothedOctagon.+"]

[[lean_lib]]
name = "ReinhardtChallenge"

[[lean_lib]]
name = "ReinhardtSolution"
