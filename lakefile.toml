name = "SmoothedOctagon"
version = "0.1.0"
keywords = ["math", "reinhardt", "packing"]
defaultTargets = ["Cited", "SmoothedOctagon", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "9d581dfff2e41de989072ea63abf3daf69311520"

# Development pin: the user's unpublished `layer1` branch of lean4-smoothed-polygon, cloned from
# the local checkout. Switch to the published repository at a pinned commit before pushing.
[[require]]
name = "SmoothedPolygons"
git = "/home/vltanh/Documents/lean4-smoothed-octagon"
rev = "a37ab122d101e7665558c8360e93ce7460d298e2"

[[lean_lib]]
name = "Cited"
globs = ["Cited.+"]

[[lean_lib]]
name = "SmoothedOctagon"
globs = ["SmoothedOctagon.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
